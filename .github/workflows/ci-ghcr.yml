name: CI And Publish

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.25.9"
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CHART_NAME: miudinho-agent
  CHART_PATH: ./charts/miudinho-agent
  CHART_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  test-and-build:
    name: Test And Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run tests
        run: go test ./... -coverprofile=cover.out

      - name: Build manager binary
        run: go build -o bin/manager ./cmd/manager

  docker:
    name: Build And Publish Image
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-chart:
    name: Package And Publish Helm Chart
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Login to GHCR for Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Lint Helm chart
        run: helm lint ${{ env.CHART_PATH }}

      - name: Package Helm chart
        run: |
          mkdir -p .cr-release-packages
          helm package ${{ env.CHART_PATH }} --destination .cr-release-packages

      - name: Push Helm chart to GHCR
        run: |
          helm push .cr-release-packages/${{ env.CHART_NAME }}-*.tgz \
            oci://${{ env.CHART_REGISTRY }}/helm
