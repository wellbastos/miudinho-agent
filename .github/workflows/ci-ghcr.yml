name: CI And Publish

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  GO_VERSION: "1.25.10"
  CHART_NAME: miudinho-agent
  CHART_PATH: ./charts/miudinho-agent

concurrency:
  group: ci-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify module files
        run: |
          go mod tidy
          go mod vendor
          git diff --exit-code go.mod go.sum vendor

      - name: Run gofmt check
        run: |
          test -z "$(git ls-files '*.go' ':!:vendor/**' | xargs gofmt -l)"

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          args: --timeout=5m ./...

      - name: Lint Helm chart
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm lint
        run: helm lint ${{ env.CHART_PATH }}

      - name: Render Helm chart
        run: helm template miudinho-agent ${{ env.CHART_PATH }} --namespace o11y

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: go test ./... -coverprofile=cover.out

      - name: Build manager binary
        run: go build -o bin/manager ./cmd/manager

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          vuln-type: library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  docker:
    name: Build And Publish Image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - security
    if: github.event_name != 'pull_request'
    outputs:
      image_name: ${{ steps.coords.outputs.image_name }}
      image_tag: ${{ steps.version.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize registry coordinates
        id: coords
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "CHART_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Compute primary image tag
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-chart:
    name: Package And Publish Helm Chart
    runs-on: ubuntu-latest
    needs:
      - docker
      - lint
      - test
      - security
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize registry coordinates
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "CHART_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Compute chart package version
        run: |
          BASE_VERSION="$(awk '/^version:/ {print $2}' "${CHART_PATH}/Chart.yaml")"
          SAFE_REF="$(echo "${GITHUB_REF_NAME}" | tr '/_' '--')"
          IMAGE_NAME="${{ needs.docker.outputs.image_name }}"
          IMAGE_TAG="${{ needs.docker.outputs.image_tag }}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            CHART_VERSION="${GITHUB_REF_NAME#v}"
          else
            CHART_VERSION="${BASE_VERSION}-${SAFE_REF}.${GITHUB_RUN_NUMBER}"
          fi

          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "CHART_VERSION=${CHART_VERSION}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Login to GHCR for Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package Helm chart
        run: |
          mkdir -p .cr-release-packages
          rm -rf .chart-package
          cp -R "${CHART_PATH}" .chart-package

          # Keep the packaged chart aligned with the image published in the docker job.
          sed -i "s#^appVersion:.*#appVersion: \"${IMAGE_TAG}\"#" .chart-package/Chart.yaml
          sed -i "s#^version:.*#version: ${CHART_VERSION}#" .chart-package/Chart.yaml
          sed -i "s#^  repository:.*#  repository: ${IMAGE_NAME}#" .chart-package/values.yaml
          sed -i "s#^  tag:.*#  tag: \"${IMAGE_TAG}\"#" .chart-package/values.yaml

          echo "Packaged chart image reference:"
          grep -E '^  repository:|^  tag:' .chart-package/values.yaml

          helm package .chart-package --destination .cr-release-packages

      - name: Push Helm chart to GHCR
        run: |
          helm push .cr-release-packages/${{ env.CHART_NAME }}-*.tgz \
            oci://${{ env.CHART_REGISTRY }}/helm
