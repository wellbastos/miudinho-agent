apiVersion: miudinho.o11y.io/v1alpha1
kind: AutoRemediationPolicy
metadata:
  name: default-observe
spec:
  selector:
    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - o11y
    severities: ["critical","high","warning"]
  guardrails:
    minAvailableReplicas: 2
    restartCooldownSeconds: 900
    blockIfReasons: ["OOMKilled","ImagePullBackOff","ErrImagePull","CreateContainerConfigError","CrashLoopBackOff","Init:ImagePullBackOff","Pending","ContainerCreating","Error"]
    allowedActions: ["observeOnly","escalate"]
  rules:
    - when:
        source: "alertmanager"
      actions:
        - type: "escalate"
    - when:
        source: "predictive"
      actions:
        - type: "escalate"
