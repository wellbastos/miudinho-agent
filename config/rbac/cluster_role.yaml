apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: miudinho-agent
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get","list","watch"]
  - apiGroups: ["sre.o11y.io"]
    resources: ["predictiveincidents","autoremediationpolicies","slopolicies"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["sre.o11y.io"]
    resources: ["predictiveincidents/status","autoremediationpolicies/status","slopolicies/status"]
    verbs: ["get","update","patch"]
  - apiGroups: [""]
    resources: ["pods","pods/log","events"]
    verbs: ["get","list","watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get","list","watch","patch","update"]
