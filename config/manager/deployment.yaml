apiVersion: apps/v1
kind: Deployment
metadata:
  name: miudinho-agent
  namespace: o11y
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miudinho-agent
  template:
    metadata:
      labels:
        app: miudinho-agent
    spec:
      serviceAccountName: miudinho-agent
      containers:
        - name: manager
          image: SEU_REGISTRY/miudinho-agent:0.1
          args:
            - "--health-probe-bind-address=:8080"
            - "--metrics-bind-address=:8081"
          ports:
            - containerPort: 8080
              name: probe
            - containerPort: 8081
              name: metrics
            - containerPort: 8090
              name: webhook
          env:
            - name: ALERT_WEBHOOK_ADDR
              value: ":8090"
            - name: ALERTMANAGER_OUTBOUND_URL
              value: "http://alertmanager-operated.o11y.svc.cluster.local:9093/api/v2/alerts"
            - name: PROM_URL
              value: "http://thanos-query.o11y.svc.cluster.local:10901"
            - name: TEMPO_URL
              value: "http://tempo.o11y.svc.cluster.local:3100"
            - name: TEMPO_PREDICTIVE_PATH
              value: "api/search"
            - name: TEMPO_PREDICTIVE_QUERY_PARAM
              value: "q"
            - name: OLLAMA_BASE_URL
              value: "http://ollama.o11y.svc.cluster.local:11434"
            - name: OLLAMA_MODEL
              value: "llama3.1:8b"
            - name: GEMINI_BASE_URL
              value: "https://generativelanguage.googleapis.com"
            - name: GEMINI_MODEL
              value: "gemini-1.5-pro"
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: miudinho-agent-secrets
                  key: GOOGLE_API_KEY
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: miudinho-agent-secrets
                  key: GITHUB_TOKEN
            - name: GITHUB_OWNER
              value: "yourorg"
            - name: GITHUB_PRODUCT_NAME
              value: "produto"
            - name: GITHUB_N2_TEAMS
              value: "sq-sre-admin,sq-sre-editor,sq-ser-viewer"
            - name: LLM_ROUTING_MODE
              value: "ollama_only"
            - name: AUTO_OBSERVE_ONLY
              value: "true"
            - name: OBSERVE_ONLY_TTL_SECONDS
              value: "300"
            - name: EXECUTE_ACTIONS
              value: "false"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
