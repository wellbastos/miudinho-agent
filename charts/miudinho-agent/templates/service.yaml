apiVersion: v1
kind: Service
metadata:
  name: {{ include "miudinho-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "miudinho-agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "miudinho-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: {{ .Values.service.ports.webhook }}
      targetPort: webhook
    - name: probe
      port: {{ .Values.service.ports.probe }}
      targetPort: probe
