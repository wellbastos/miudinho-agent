{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "miudinho-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "miudinho-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "miudinho-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Permite que o Alertmanager envie webhooks (porta 8090)
    - from:
        {{- range .Values.networkPolicy.alertmanagerNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: 8090
          protocol: TCP
    # Permite scraping de métricas pelo Prometheus (porta 8081)
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8081
          protocol: TCP
    # Permite health probes do kubelet (porta 8080)
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    # Acesso à API do Kubernetes (controller-runtime)
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # Acesso aos serviços de observabilidade internos e LLM
    - to:
        - namespaceSelector: {}
      ports:
        - port: 9093
          protocol: TCP
        - port: 10901
          protocol: TCP
        - port: 3100
          protocol: TCP
        - port: 11434
          protocol: TCP
    # Acesso ao Gemini e GitHub (HTTPS externo)
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
