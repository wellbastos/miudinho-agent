{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "miudinho-agent.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "miudinho-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  GOOGLE_API_KEY: {{ .Values.secret.googleApiKey | quote }}
  GITHUB_TOKEN: {{ .Values.secret.githubToken | quote }}
  GOOGLE_CHAT_INCIDENTS_WEBHOOK_URL: {{ .Values.secret.googleChatIncidentsWebhookUrl | quote }}
  {{- if .Values.secret.webhookToken }}
  WEBHOOK_TOKEN: {{ .Values.secret.webhookToken | quote }}
  {{- end }}
  {{- if .Values.secret.lokiUsername }}
  LOKI_USERNAME: {{ .Values.secret.lokiUsername | quote }}
  {{- end }}
  {{- if .Values.secret.lokiPassword }}
  LOKI_PASSWORD: {{ .Values.secret.lokiPassword | quote }}
  {{- end }}
  {{- if .Values.secret.lokiToken }}
  LOKI_TOKEN: {{ .Values.secret.lokiToken | quote }}
  {{- end }}
{{- end }}
