{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "miudinho-agent.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "miudinho-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  GOOGLE_API_KEY: {{ .Values.secret.googleApiKey | quote }}
  GITHUB_TOKEN: {{ .Values.secret.githubToken | quote }}
{{- end }}
