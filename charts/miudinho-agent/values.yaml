replicaCount: 1

image:
  repository: ghcr.io/wellbastos/miudinho-agent
  tag: "latest"
  pullPolicy: Always

log:
  level: "info"

nameOverride: "miudinho-agent"
fullnameOverride: "miudinho-agent"

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

leaderElection:
  enabled: false

service:
  type: ClusterIP
  annotations: {}
  ports:
    webhook: 8090
    probe: 8080
    metrics: 8081

serviceMonitor:
  enabled: true
  namespace: ""
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  honorLabels: false

podMonitor:
  enabled: false
  namespace: ""
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  honorLabels: false

secret:
  create: true
  name: ""
  googleApiKey: "COLOQUE_AQUI"
  githubToken: "COLOQUE_AQUI"
  googleChatIncidentsWebhookUrl: "COLOQUE_AQUI"
  # Token compartilhado para autenticar o Alertmanager no webhook.
  # Gere com: openssl rand -base64 32
  # Configure o Alertmanager para enviar: Authorization: Bearer <token>
  # Se vazio, a autenticação é desabilitada (não recomendado em produção).
  # webhookToken: ""

env:
  alertWebhookAddr: ":8090"
  alertPollInterval: "30s"
  alertSourcesEnabled: "prometheus,alertmanager"
  alertmanagerOutboundUrl: "http://alertmanager-operated.o11y.svc.cluster.local:9093/api/v2/alerts"
  alertmanagerApiUrl: "http://alertmanager-operated.o11y.svc.cluster.local:9093/api/v2/alerts"
  promUrl: "http://thanos-query.o11y.svc.cluster.local:10902"
  tempoUrl: "http://tempo.o11y.svc.cluster.local:3100"
  tempoPredictivePath: "api/search"
  tempoPredictiveQueryParam: "q"
  ollamaBaseUrl: "http://ollama.o11y.svc.cluster.local:11434"
  ollamaModel: "llama3.1:8b"
  geminiBaseUrl: "https://generativelanguage.googleapis.com"
  geminiModel: "gemini-2.5-flash"
  systemPrompt: "Você é um Agente SRE de produção. Responda sempre em JSON válido com classification, confidence, summary, evidence, prom_queries, actions, rollback_or_next_steps, escalation. Para predictive, priorize low-risk. Confidence < 0.70 => sem mudanças."
  approverPrompt: "Você é o Change Approver. Responda somente JSON com approved, risk_level, reasons, required_changes. Bloqueie ações arriscadas e qualquer confidence < 0.70."
  githubOwner: "wellbastos"
  githubRepositoryPrefix: "" #"apps-"
  githubProductName: "miudinho-agent" # repo name
  githubN2Teams: "sre-editor,sre-viewer,sre-admin"
  llmRoutingMode: "gemini_only"
  autoObserveOnly: "false"
  observeOnlyTtlSeconds: "300"
  executeActions: "true"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: true
  # Namespaces de onde o Alertmanager pode enviar webhooks
  alertmanagerNamespaces:
    - o11y

nodeSelector: {}

tolerations: []

affinity: {}
